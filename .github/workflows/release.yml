name: Release

# Every consumer of these packages installs a published version, so a merge to
# develop that changes a package is only half a change until it is on the
# registry. This workflow is the other half: it turns the changesets sitting in
# .changeset/ into version bumps.
#
# It only opens a "Version Packages" pull request and publishes nothing.
# Releasing is a tag or a GitHub release, which runs publish.yml.

on:
  push:
    branches: [develop]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version PR
    # GitHub-hosted: this repository is public, so the minutes are free and
    # unlimited.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      # No publish-script and no NPM_TOKEN: publishing runs in publish.yml,
      # from a tag or a release.
      - name: Open the Version PR
        uses: changesets/action@v2
        with:
          version-script: bun run changeset:version
          pr-title: 'chore: Version packages'
          commit-message: 'chore: Version packages'
          # v2 ignores GITHUB_TOKEN in env for its own GitHub API calls.
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # changelog-github still reads GITHUB_TOKEN while versioning.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
